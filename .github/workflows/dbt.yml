name: dbt build

# Every push and pull request rebuilds the warehouse from the committed raw
# snapshots and runs every dbt test. Pushes to main also publish the dbt docs
# site (models, column docs, lineage graph) to GitHub Pages.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load raw data + dbt build (models and tests)
        run: bash scripts/build_warehouse.sh

      - name: Generate dbt docs site
        working-directory: dbt
        run: |
          dbt docs generate --static
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - name: Upload docs site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
