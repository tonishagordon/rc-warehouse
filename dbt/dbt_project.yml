name: rc_warehouse
version: "1.0.0"
config-version: 2

profile: rc_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

models:
  rc_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  rc_warehouse:
    +schema: seeds
    crosswalk_manual:
      +column_types:
        show_a: varchar
        season_a: varchar
        name_a: varchar
        show_b: varchar
        season_b: varchar
        name_b: varchar
        decision: varchar
        note: varchar
