version: 2

models:
  - name: int_person_mentions
    description: >
      Every person-season appearance across Survivor, Big Brother and The
      Challenge with normalized names, nicknames and (for Challenge) a pointer
      to the origin season when it's in the warehouse. Input to entity resolution.
    columns:
      - name: mention_key
        data_tests: [unique, not_null]
      - name: name_norm
        data_tests: [not_null]

  - name: int_origin_matches
    description: >
      Links each person whose record names an earlier US Survivor / Big Brother
      season (Challenge "Original season"; Survivor seasons listed on a Big
      Brother houseguest's name) to the matching person in that season.
      Blocked by origin season, scored on name/nickname similarity.
      match_decision: auto / review / no_match / no_candidates.
    columns:
      - name: source_mention_key
        data_tests: [unique, not_null]
      - name: match_decision
        data_tests:
          - accepted_values:
              arguments:
                values: ['auto', 'review', 'no_match', 'no_candidates']
